# NotebookLLM-Lite — single-tenant demo stack (no auth, OpenRouter LLM).
#
# Differences from the full SaaS docker-compose.yml:
#   - no OIDC/Keycloak, no per-tenant auth (LITE_MODE=true)
#   - no Ollama; embeddings use OpenAI (OpenRouter has no embeddings endpoint)
#   - one-shot `init` runs DB migrations + seeds the default workspace
#   - Traefik path-routes frontend (/) and API (/api) on a single local port
#
# Usage:
#   cp deploy/.env.lite.example deploy/.env.lite   # then fill in keys
#   docker compose -f deploy/docker-compose.lite.yml --env-file deploy/.env.lite up -d --build
# Open http://localhost:8080

name: notebookllm-lite

networks:
  edge:
  appnet:

volumes:
  pg_data:
  redis_data:
  surreal_data:
  minio_data:
  notebook_data:
  presenton_data:

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-8099}:80"      # open http://localhost:8099 (configurable via TRAEFIK_PORT)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [edge]

  # One-shot: apply migrations then seed the default tenant/admin, then exit.
  init:
    build: ../backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_lite"]
    env_file: .env.lite
    # service_started raced Postgres startup: `alembic upgrade head` could run
    # before the server was accepting connections.
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]
    restart: "no"

  frontend:
    build:
      context: ../frontend
      args:
        - NEXT_PUBLIC_DEV_MODE=false
        - NEXT_PUBLIC_LITE_MODE=${NEXT_PUBLIC_LITE_MODE:-true}
        - NEXT_PUBLIC_DEFAULT_TENANT_NAME=${NEXT_PUBLIC_DEFAULT_TENANT_NAME:-Demo Workspace}
    env_file: .env.lite
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # This service is on two networks; tell Traefik to route via edge (where it
      # lives) or it may pick the appnet IP it can't reach -> 504 timeouts.
      - "traefik.docker.network=notebookllm-lite_edge"
    networks: [edge, appnet]

  orchestrator:
    build: ../backend
    env_file: .env.lite
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.docker.network=notebookllm-lite_edge"
    networks: [edge, appnet]

  worker:
    build: ../backend
    command: ["arq", "src.workers.WorkerSettings"]
    env_file: .env.lite
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [appnet]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    networks: [appnet]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    # Persistence is NOT optional here. Redis holds the pending job queue while
    # Postgres holds the durable Job row; without a volume, every restart silently
    # emptied the queue and stranded jobs at `queued` with attempts=0 forever.
    # appendonly gives per-second fsync durability, which is the right trade for a
    # work queue -- losing a second of enqueues beats losing the whole queue.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis_data:/data"]
    networks: [appnet]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    networks: [appnet]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Uncomment to reach the MinIO console at http://localhost:9001
    # ports: ["127.0.0.1:9001:9001"]

  # --- Internal engines ------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --user ${SURREAL_USER} --pass ${SURREAL_PASSWORD} rocksdb:/mydata/db.db
    user: root
    volumes: ["surreal_data:/mydata"]
    networks: [appnet]
    restart: always

  open-notebook:
    image: lfnovo/open_notebook:v1-latest
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE}
      SURREAL_DATABASE: ${SURREAL_DATABASE}
      # Analysis LLM is passed per-request by the orchestrator (OpenRouter).
      # Embeddings need their own provider — OpenRouter has none, so use OpenAI:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      # Document extraction is INSTALLED AT CONTAINER STARTUP, only when enabled.
      # docker-entrypoint.sh guards it with `is_true "$$OPEN_NOTEBOOK_ENABLE_DOCLING"`,
      # so leaving it unset means content-core[docling] is never installed and the
      # engine has NO extractor for .docx/.pptx/.xlsx — those sources fail with
      # "Could not extract content ... unsupported format" and started_at: null,
      # while .md and .txt still work because plain text needs no extractor.
      #
      # First start after enabling this pulls a large ML stack (several hundred MB to
      # a few GB) and takes minutes. It persists on the notebook_data volume.
      OPEN_NOTEBOOK_ENABLE_DOCLING: ${OPEN_NOTEBOOK_ENABLE_DOCLING:-true}
      # Only needed to ingest web URLs; also pulls a ~150MB Chromium. Off by default.
      OPEN_NOTEBOOK_ENABLE_CRAWL4AI: ${OPEN_NOTEBOOK_ENABLE_CRAWL4AI:-false}
    volumes: ["notebook_data:/app/data"]
    depends_on: [surrealdb]
    networks: [appnet]
    restart: always
    # First run only — expose the UI to confirm the embedding provider/model:
    # ports: ["127.0.0.1:8502:8502", "127.0.0.1:5055:5055"]

  presenton:
    build:
      context: ../presenton-custom
    environment:
      DISABLE_AUTH: "true"
      MIGRATE_DATABASE_ON_STARTUP: "true"
      LLM: "custom"                          # OpenAI-compatible → OpenRouter
      CUSTOM_LLM_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CUSTOM_LLM_API_KEY: ${OPENROUTER_API_KEY}
      CUSTOM_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      CAN_CHANGE_KEYS: ${PRESENTON_CAN_CHANGE_KEYS}
      AUTH_USERNAME: ${PRESENTON_AUTH_USERNAME}
      AUTH_PASSWORD: ${PRESENTON_AUTH_PASSWORD}
    volumes: ["presenton_data:/app_data"]
    healthcheck:
      # Any HTTP answer means it is listening; a redirect or 401 still counts.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:80/ | grep -qE '^[2345]' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${PRESENTON_EXPOSED_PORT:-8100}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.presenton.rule=PathPrefix(`/editor`) || PathPrefix(`/api/v1/ppt`) || PathPrefix(`/api/can-change-keys`) || PathPrefix(`/api/runtime-config`) || PathPrefix(`/api/telemetry-status`) || PathPrefix(`/api/user-config`) || PathPrefix(`/api/validate-layout-code`) || PathPrefix(`/api/read-file`) || PathPrefix(`/api/mock`) || PathPrefix(`/api/v1/admin`) || PathPrefix(`/api/v1/auth/token`) || PathPrefix(`/api/export-presentation`) || PathPrefix(`/api/v1/auth/status`) || PathPrefix(`/app_data`) || PathPrefix(`/images`) || PathPrefix(`/uploads`) || PathPrefix(`/fonts`)"
      - "traefik.http.routers.presenton.priority=20"
      # NO stripprefix (T-1.1). With basePath: '/editor' baked into Presenton's build,
      # Next.js expects the full /editor/... path; stripping it would produce the same
      # 404 from the other direction. The engine's next.config.mjs must carry
      # `basePath: '/editor'` -- assetPrefix alone prefixes assets but NOT routing,
      # which is exactly why /editor returned Next's 404 layout while assets resolved.
      - "traefik.http.services.presenton.loadbalancer.server.port=80"
      - "traefik.docker.network=notebookllm-lite_edge"
    networks: [edge, appnet]
    restart: always

