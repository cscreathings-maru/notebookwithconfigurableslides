name: CI

# The repository had no CI at all, so every gate in the revamp programme depended on
# someone running commands by hand. This makes the three test tiers enforceable.
#
# The E2E smoke suite is NOT here: it needs a live stack including Presenton, whose
# source is not yet in the repository (see revamp/TECH-DEBT.md, TD-01). Adding a job
# that cannot run would be the same false-signal problem T-2.6 deleted.

on:
  push:
    branches: [main, "revamp/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=87

  migrations:
    # TD-20: migrations were only ever exercised against SQLite. A revision id longer
    # than alembic_version.version_num (varchar 32) passes there and fails on deploy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orch
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: orchestrator
        options: >-
          --health-cmd "pg_isready -U orch -d orchestrator"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://orch:ci@localhost:5432/orchestrator
      ORCH_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt

      - name: Round-trip every migration
        run: alembic upgrade head && alembic downgrade -1 && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test with coverage thresholds
        run: npm run test:coverage

  build:
    # Proves the stack still builds from a clean checkout. `presenton` is excluded:
    # its build context does not exist in this repository yet (TD-01/TD-04).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp deploy/.env.lite.example deploy/.env.lite
          docker compose -f deploy/docker-compose.lite.yml --env-file deploy/.env.lite \
            build init orchestrator worker frontend
